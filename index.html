<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java</title>
    <link rel="stylesheet" href="Java.css" />
  </head>
  <body>
    <div class="container">
      <div id="home">
        <h1 id="home-title">HOME</h1>
        <div id="home-result">0</div>

        <div class="buttons">
          <button id="h1point">+1</button>
          <button id="h2point">+2</button>
          <button id="h3point">+3</button>
        </div>
      </div>

      <div id="away">
        <h1 id="away-title">AWAY</h1>
        <div id="away-result">0</div>

        <div class="buttons">
          <button id="a1point">+1</button>
          <button id="a2point">+2</button>
          <button id="a3point">+3</button>
        </div>
      </div>
    </div>

    <script src="Java.js"></script>
  </body>
</html>
